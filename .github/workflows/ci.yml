name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Unit Tests
        run: npm run test

      - name: Build Next.js Project
        run: npm run build
        env:
          NEXTAUTH_SECRET: "ci_test_secret_32_characters_long_key"
          DATABASE_URL: "mongodb+srv://demo:demo@cluster.mongodb.net/shop"
